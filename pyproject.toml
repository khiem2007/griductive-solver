[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-ledger"
version = "0.1.0"
description = "An offline notebook for provable grid deductions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "build>=1.2"]

[project.gui-scripts]
proof-ledger = "proofledger.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofledger = ["samples/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
